services:
  - type: web
    name: pautangtrack
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: pautangtrack-db
          property: connectionString

databases:
  - name: pautangtrack-db
    databaseName: pautangtrack
    user: pautangtrack
    plan: basic-256mb
